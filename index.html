<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">✓</div>
      <div>
        <h1>Gestión de Tareas</h1>
        <p>Laboratorio #2 · TypeScript + MVC</p>
      </div>
    </header>

    <div class="grid">
      <!-- IZQUIERDA: formulario -->
      <aside class="card nueva">
        <h2>Nueva tarea</h2>
        <div id="mensaje" class="mensaje"></div>
        <form id="form-tarea">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="¿Qué tienes que hacer?" required>
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" placeholder="Detalles (opcional)" rows="4"></textarea>
          <button type="submit" id="btn-guardar">Agregar tarea</button>
          <button type="button" id="btn-cancelar" hidden>Cancelar</button>
        </form>
      </aside>

      <!-- CENTRO: lista -->
      <section class="card principal">
        <div class="cabecera-lista">
          <h2>Mis tareas</h2>
        </div>
        <div class="controles">
          <input type="search" id="buscar" placeholder="🔍 Buscar por título...">
          <select id="filtro">
            <option value="todas">Todas</option>
            <option value="pendientes">Pendientes</option>
            <option value="completadas">Completadas</option>
          </select>
        </div>
        <ul id="lista"></ul>
      </section>

      <!-- DERECHA: resumen -->
      <aside class="card resumen">
        <h2>Resumen</h2>
        <div class="anillo-wrap">
          <div class="anillo" id="anillo">
            <div class="anillo-centro">
              <span id="pct-texto">0%</span>
              <small>completado</small>
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="stat s-total"><span id="stat-total">0</span><small>Total</small></div>
          <div class="stat s-pend"><span id="stat-pend">0</span><small>Pendientes</small></div>
          <div class="stat s-comp"><span id="stat-comp">0</span><small>Completadas</small></div>
        </div>

        <div class="barras">
          <div class="barra-fila">
            <div class="barra-label"><span>Pendientes</span></div>
            <div class="barra"><div class="barra-fill b-pend" id="barra-pend"></div></div>
          </div>
          <div class="barra-fila">
            <div class="barra-label"><span>Completadas</span></div>
            <div class="barra"><div class="barra-fill b-comp" id="barra-comp"></div></div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
